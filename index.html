<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071220"><link rel="manifest" href="manifest.json"><link rel="icon" href="appicon-192.png"><title>RaceCompanion 25/26 v1.13.0</title><style>
*{box-sizing:border-box}html{background:#06101c}body{margin:0;color:#fff;font-family:Arial,sans-serif;background:#06101c url('background.png') center top/cover fixed no-repeat}#app{max-width:520px;margin:auto;min-height:100vh;padding:12px 12px 96px;background:linear-gradient(180deg,rgba(4,12,23,.16),rgba(5,10,18,.12))}.page{display:none}.page.on{display:block}header{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:4;margin:-12px -12px 10px;padding:10px 12px;background:rgba(8,18,31,.46);border-bottom:1px solid rgba(255,255,255,.22);backdrop-filter:blur(22px)}header img{width:32px;height:32px;border-radius:8px}.brand{font:bold italic 14px Arial Black,Arial}.brand b{color:#f13b43}.ver{margin-left:auto;color:#b9c3cf;font-size:9px}h1{font:bold italic 25px Arial Black,Arial;text-transform:uppercase}.glass{background:linear-gradient(145deg,rgba(42,53,69,.58),rgba(17,26,39,.43));border:1px solid rgba(255,255,255,.30);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 12px 30px rgba(0,0,0,.27);backdrop-filter:blur(20px) saturate(145%);overflow:hidden;margin-top:12px}.pad{padding:13px}.hero{width:100%;aspect-ratio:16/9;display:block;object-fit:cover}.mapbox{height:162px;display:flex;align-items:center;justify-content:center;background:rgba(23,34,50,.66)}.mapimg{width:74%;height:77%;object-fit:contain;filter:grayscale(1) brightness(2.6) contrast(2);mix-blend-mode:screen;opacity:.84}.metrics,.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{text-align:center;padding:12px 6px;border-radius:14px;background:rgba(16,26,40,.48);border:1px solid rgba(255,255,255,.18)}.metric span{display:block;color:#c4ccd6;font-size:8px;font-weight:800}.metric strong{font:bold italic 18px Arial Black,Arial}label{display:block;color:#c8d0da;font-size:9px;font-weight:bold;text-transform:uppercase;margin:9px 0 4px}input,select{width:100%;padding:12px;background:rgba(8,17,29,.55);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:11px;font-size:16px}.primary,.secondary{width:100%;border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:13px;color:white;font:bold italic 13px Arial Black,Arial}.primary{background:linear-gradient(#f3444d,#bc0010)}.secondary{background:rgba(45,58,76,.7)}.nav{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:500px;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border:1px solid rgba(255,255,255,.28);border-radius:26px;background:rgba(19,29,43,.58);backdrop-filter:blur(24px);z-index:9}.nav button{border:0;background:none;color:#b7c0cb;padding:5px;font-size:9px}.nav button span{display:block;font-size:17px}.nav button.on{background:rgba(220,14,26,.34);border-radius:18px;color:#fff}.seasonbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.badge{padding:5px 8px;border-radius:12px;background:rgba(241,59,67,.22);border:1px solid rgba(241,59,67,.5);font-size:10px}.country{font-size:10px;letter-spacing:3px;color:#d5dce5}.trackCard{cursor:pointer}.trackTitle{padding:11px 12px}.pbrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px}.status,.listline{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.13)}.status{border-left:3px solid #f13b43;background:rgba(22,31,44,.68);margin-top:9px}.seasonItem{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.13)}
</style></head><body><main id="app"><header><img src="appicon-192.png"><span class="brand">RACECOMPANION <b>25/26</b></span><span class="ver">v1.13.0 MULTI-SEASON</span></header>
<section id="home" class="page on"><div class="glass pad seasonbar"><div><label>Aktive Saison</label><select id="seasonQuick"></select></div><span class="badge" id="seasonState"></span></div><h1 id="hello">Race Weekend</h1><div id="homeStats" class="metrics"></div><div class="glass pad"><b>LETZTES ERGEBNIS</b><div id="last"></div><button class="primary" data-go="entry">RENNEN EINTRAGEN</button></div></section>
<section id="entry" class="page"><h1>Rennen erfassen</h1><div id="draftBanner"></div><div class="glass pad"><label>Saison</label><select id="raceSeason"></select><label>Fahrername</label><input id="driver"><label>Strecke</label><select id="track"></select><label>Team</label><select id="team"></select><div class="row"><div><label>Qualifying Platz</label><select id="qp"></select></div><div><label>Qualifying Zeit</label><input id="qt" inputmode="numeric" placeholder="142580"></div></div><button id="saveQ" class="secondary" style="margin-top:12px">QUALIFYING ZWISCHENSPEICHERN</button><div class="row"><div><label>Rennplatz</label><select id="rp"></select></div><div><label>Schnellste Runde</label><input id="rt" inputmode="numeric" placeholder="145219"></div></div><button id="saveRace" class="primary" style="margin-top:12px">RENNWOCHENENDE SPEICHERN</button><div id="entryMsg"></div></div></section>
<section id="tracks" class="page"><h1>Strecken</h1><div class="glass pad"><label>Ansicht</label><select id="trackScope"><option value="season">Aktive Saison</option><option value="all">All Time</option></select><input id="search" placeholder="Strecke suchen" style="margin-top:8px"></div><div id="trackList"></div></section><section id="detail" class="page"><button class="secondary" data-go="tracks" style="width:auto">‹ Strecken</button><div id="detailBody"></div></section>
<section id="stats" class="page"><h1>Statistik</h1><div id="statsBody"></div></section>
<section id="more" class="page"><h1>Mehr</h1><div class="glass pad"><button class="secondary" data-go="seasons">SAISONEN</button><button class="secondary" data-go="setups" style="margin-top:8px">SETUPS</button><button class="secondary" data-go="data" style="margin-top:8px">DATEN / BACKUP</button></div></section>
<section id="seasons" class="page"><h1>Saisons</h1><div class="glass pad"><label>Neue Saison</label><input id="newSeason" placeholder="z. B. 2027"><button id="addSeason" class="primary" style="margin-top:8px">SAISON ANLEGEN</button></div><div id="seasonList"></div><button class="secondary" data-go="more" style="margin-top:10px">ZURÜCK</button></section>
<section id="setups" class="page"><h1>Setups</h1><div class="glass pad"><label>Strecke</label><select id="setupTrack"></select><label>Name</label><input id="setupName"><label>Notiz</label><input id="setupNote"><button id="saveSetup" class="primary" style="margin-top:8px">SETUP SPEICHERN</button></div><div id="setupList"></div></section>
<section id="data" class="page"><h1>Daten</h1><div class="glass pad"><button id="exportBtn" class="primary">BACKUP ALLER SAISONS</button><label>Backup importieren</label><input id="importFile" type="file" accept=".json,application/json"></div></section></main>
<nav class="nav"><button class="on" data-go="home"><span>⌂</span>Home</button><button data-go="entry"><span>🏁</span>Rennen</button><button data-go="tracks"><span>◉</span>Strecken</button><button data-go="stats"><span>▥</span>Statistik</button><button data-go="more"><span>☰</span>Mehr</button></nav>
<script>'use strict';const TRACKS=["Australien · Melbourne", "China · Shanghai", "Japan · Suzuka", "Bahrain · Sakhir", "Saudi-Arabien · Jeddah", "USA · Miami", "Italien · Imola", "Monaco · Monte Carlo", "Spanien · Barcelona", "Kanada · Montreal", "Österreich · Red Bull Ring", "Großbritannien · Silverstone", "Belgien · Spa-Francorchamps", "Ungarn · Hungaroring", "Niederlande · Zandvoort", "Italien · Monza", "Aserbaidschan · Baku", "Singapur · Marina Bay", "USA · Austin", "Mexiko · Mexico City", "Brasilien · Interlagos", "USA · Las Vegas", "Katar · Lusail", "Abu Dhabi · Yas Marina", "Spanien · Madrid"],KEYS=["melbourne", "shanghai", "suzuka", "bahrain", "jeddah", "miami", "imola", "monaco", "barcelona", "montreal", "red-bull-ring", "silverstone", "spa-francorchamps", "hungaroring", "zandvoort", "monza", "baku", "singapore", "austin", "mexico-city", "interlagos", "las-vegas", "lusail", "yas-marina", ""],PTS={P1:25,P2:18,P3:15,P4:12,P5:10,P6:8,P7:6,P8:4,P9:2,P10:1};const $=id=>document.getElementById(id);function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}let races=get('f1races',[]),setups=get('f1setups',[]),draft=get('f1qualidraft',null),seasons=get('f1seasons',null);if(!seasons){seasons=[{id:'2025',name:'2025',archived:true},{id:'2026',name:'2026',archived:false}];localStorage.f1seasons=JSON.stringify(seasons)}let active=localStorage.f1activeSeason||seasons.find(x=>!x.archived)?.id||seasons[0].id;/* migrate old races */races=races.map(x=>({...x,season:x.season||'2026'}));if(draft&&!draft.season)draft.season='2026';localStorage.f1races=JSON.stringify(races);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(v){v=(v||'').trim();if(/^\d{4,7}$/.test(v)){let ms=v.slice(-3),b=v.slice(0,-3),sec=b.slice(-2),min=b.slice(0,-2)||'0';if(+sec<60)return `${min}:${sec}.${ms}`}return v}function sec(v){let m=norm(v).match(/^(\d+):([0-5]?\d)\.(\d{1,3})$/);return m?+m[1]*60+ +m[2]+ +(m[3].padEnd(3,'0'))/1000:null}function best(a,k){return a.filter(x=>sec(x[k])!==null).sort((x,y)=>sec(x[k])-sec(y[k]))[0]?.[k]||'—'}function sname(t){return (t||'').split(' · ')[1]||t}function seasonRaces(){return races.filter(x=>x.season===active)}function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.go===id));render();scrollTo(0,0)}document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});$('track').innerHTML=TRACKS.map(x=>`<option>${x}</option>`).join('');$('setupTrack').innerHTML=$('track').innerHTML;['Ferrari','McLaren','Mercedes','Red Bull Racing','Aston Martin','Williams','Alpine','Haas','Racing Bulls','Sauber','Audi'].forEach(x=>$('team').add(new Option(x,x)));for(let i=1;i<=20;i++){$('qp').add(new Option('P'+i,'P'+i));$('rp').add(new Option('P'+i,'P'+i))}['DNF','DNS','DSQ'].forEach(x=>$('rp').add(new Option(x,x)));$('driver').value=localStorage.f1driver||'';function fillSeasons(){let opts=seasons.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.archived?' · Archiv':''}</option>`).join('');$('seasonQuick').innerHTML=opts;$('raceSeason').innerHTML=opts;$('seasonQuick').value=active;$('raceSeason').value=active}fillSeasons();$('seasonQuick').onchange=()=>setActive($('seasonQuick').value);function setActive(id){active=id;localStorage.f1activeSeason=id;$('raceSeason').value=id;render()}$('addSeason').onclick=()=>{let n=$('newSeason').value.trim();if(!n||seasons.some(x=>x.name===n))return;let id='s'+Date.now();seasons.push({id,name:n,archived:false});localStorage.f1seasons=JSON.stringify(seasons);active=id;localStorage.f1activeSeason=id;fillSeasons();render()};function renderSeasons(){$('seasonList').innerHTML=seasons.map(x=>`<div class="glass pad seasonItem"><div><b>${esc(x.name)}</b><br><span style="font-size:10px">${races.filter(r=>r.season===x.id).length} Rennen · ${x.archived?'Archiviert':'Aktiv'}</span></div><div><button class="secondary" data-season-active="${x.id}">ÖFFNEN</button><button class="secondary" data-season-archive="${x.id}" style="margin-top:5px">${x.archived?'REAKTIVIEREN':'ARCHIVIEREN'}</button></div></div>`).join('');document.querySelectorAll('[data-season-active]').forEach(b=>b.onclick=()=>{setActive(b.dataset.seasonActive);go('home')});document.querySelectorAll('[data-season-archive]').forEach(b=>b.onclick=()=>{let x=seasons.find(s=>s.id===b.dataset.seasonArchive);x.archived=!x.archived;localStorage.f1seasons=JSON.stringify(seasons);fillSeasons();renderSeasons()})}function draftToForm(){if(!draft)return;let i=TRACKS.indexOf(draft.track);if(i>=0)$('track').selectedIndex=i;$('driver').value=draft.driver||'';$('team').value=draft.team||$('team').value;$('qp').value=draft.qp||'P1';$('qt').value=draft.qt||'';$('raceSeason').value=draft.season||active}draftToForm();function msg(t){$('entryMsg').className='status';$('entryMsg').textContent=t}$('saveQ').onclick=()=>{let d=$('driver').value.trim(),qt=norm($('qt').value);if(!d||sec(qt)===null)return msg('Fahrer und gültige Qualifying-Zeit eingeben.');draft={driver:d,season:$('raceSeason').value,track:$('track').value,team:$('team').value,qp:$('qp').value,qt,date:new Date().toLocaleDateString('de-DE')};localStorage.f1driver=d;localStorage.f1qualidraft=JSON.stringify(draft);msg('✓ Qualifying für '+seasons.find(x=>x.id===draft.season)?.name+' zwischengespeichert.');render()};$('saveRace').onclick=()=>{let qt=norm($('qt').value),rt=norm($('rt').value),d=$('driver').value.trim();if(!d||sec(qt)===null||sec(rt)===null)return msg('Qualifying und Rennrunde vollständig eintragen.');races.push({driver:d,season:$('raceSeason').value,track:$('track').value,team:$('team').value,qp:$('qp').value,qt,rp:$('rp').value,rt,date:new Date().toLocaleDateString('de-DE')});localStorage.f1races=JSON.stringify(races);localStorage.removeItem('f1qualidraft');draft=null;msg('✓ Rennwochenende gespeichert.');render()};$('search').oninput=renderTracks;$('trackScope').onchange=renderTracks;function renderTracks(){let q=$('search').value.toLowerCase(),src=$('trackScope').value==='all'?races:seasonRaces(),g={};src.forEach(x=>(g[x.track]??=[]).push(x));$('trackList').innerHTML=TRACKS.map((t,i)=>({t,i,a:g[t]||[]})).filter(x=>x.t.toLowerCase().includes(q)).map(({t,i,a})=>`<div class="glass trackCard" data-ti="${i}"><div class="pad"><b>${esc(sname(t))}</b><div class="country">${esc(t.split(' · ')[0].toUpperCase())}</div></div>${KEYS[i]?`<img class="hero" src="panorama-${KEYS[i]}.jpg">`:''}<div class="pbrow"><div class="metric"><span>QUALI PB</span><strong>${best(a,'qt')}</strong></div><div class="metric"><span>RACE PB</span><strong>${best(a,'rt')}</strong></div></div></div>`).join('')}document.addEventListener('click',e=>{let c=e.target.closest('[data-ti]');if(c)openTrack(+c.dataset.ti)});function openTrack(i){let t=TRACKS[i],seasonA=seasonRaces().filter(x=>x.track===t),allA=races.filter(x=>x.track===t),k=KEYS[i];$('detailBody').innerHTML=`<h1>${esc(sname(t))}</h1><div class="glass">${k?`<img class="hero" src="panorama-${k}.jpg"><div class="mapbox"><img class="mapimg" src="map-${k}.jpg"></div>`:''}<div class="pad"><b>SAISON ${esc(seasons.find(x=>x.id===active)?.name||active)}</b><div class="pbrow"><div class="metric"><span>QUALI PB</span><strong>${best(seasonA,'qt')}</strong></div><div class="metric"><span>RACE PB</span><strong>${best(seasonA,'rt')}</strong></div></div><b>ALL TIME</b><div class="pbrow"><div class="metric"><span>QUALI PB</span><strong>${best(allA,'qt')}</strong></div><div class="metric"><span>RACE PB</span><strong>${best(allA,'rt')}</strong></div></div></div></div>`;go('detail')}function render(){let sr=seasonRaces(),sn=seasons.find(x=>x.id===active),total=sr.reduce((a,x)=>a+(PTS[x.rp]||0),0),wins=sr.filter(x=>x.rp==='P1').length,pods=sr.filter(x=>['P1','P2','P3'].includes(x.rp)).length;$('seasonState').textContent=sn?.archived?'ARCHIV':'AKTIV';$('hello').textContent=(localStorage.f1driver?`Guten Abend, ${localStorage.f1driver}`:'RACE WEEKEND')+' · '+(sn?.name||active);$('homeStats').innerHTML=[[total,'PUNKTE'],[wins,'SIEGE'],[pods,'PODIEN'],[sr.length,'RENNEN']].map(x=>`<div class="metric"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');let l=sr.at(-1);$('last').innerHTML=l?`<div class="listline"><b>${esc(sname(l.track))} · ${esc(l.team)}</b><br>${l.qp} → ${l.rp}</div>`:'<p>Noch kein Rennen in dieser Saison.</p>';$('draftBanner').innerHTML=draft?`<div class="status"><b>QUALIFYING GESPEICHERT · ${esc(seasons.find(x=>x.id===draft.season)?.name||draft.season)}</b><br>${esc(sname(draft.track))} · ${draft.qp} · ${draft.qt}<br>Rennen offen.</div>`:'';let ranks=Object.entries(PTS).map(([p,v])=>`<div class="listline">${p}<b style="float:right">${sr.filter(x=>x.rp===p).length}× · ${sr.filter(x=>x.rp===p).length*v} Pkt.</b></div>`).join('');$('statsBody').innerHTML=`<div class="glass pad"><b>${esc(sn?.name||active)}</b><div class="metrics"><div class="metric"><strong>${sr.length}</strong><span>RENNEN</span></div><div class="metric"><strong>${total}</strong><span>PUNKTE</span></div><div class="metric"><strong>${wins}</strong><span>SIEGE</span></div><div class="metric"><strong>${pods}</strong><span>PODIEN</span></div></div></div><div class="glass pad">${ranks}</div>`;renderTracks();renderSeasons()}$('driver').oninput=()=>localStorage.f1driver=$('driver').value;$('saveSetup').onclick=()=>{let n=$('setupName').value.trim();if(!n)return;setups.push({id:Date.now(),track:$('setupTrack').value,name:n,note:$('setupNote').value.trim()});localStorage.f1setups=JSON.stringify(setups);renderSetups()};function renderSetups(){$('setupList').innerHTML=setups.filter(x=>x.track===$('setupTrack').value).map(x=>`<div class="glass pad"><b>${esc(x.name)}</b><br>${esc(x.note||'')}</div>`).join('')||'<div class="glass pad">Noch kein Setup.</div>'}$('setupTrack').onchange=renderSetups;$('exportBtn').onclick=()=>{let b=new Blob([JSON.stringify({version:'1.13.0',driver:localStorage.f1driver||'',activeSeason:active,seasons,races,setups,draft},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='RaceCompanion_MultiSeason_Backup.json';a.click()};$('importFile').onchange=async e=>{let x=JSON.parse(await e.target.files[0].text());localStorage.f1driver=x.driver||'';localStorage.f1activeSeason=x.activeSeason||'2026';localStorage.f1seasons=JSON.stringify(x.seasons||seasons);localStorage.f1races=JSON.stringify(x.races||[]);localStorage.f1setups=JSON.stringify(x.setups||[]);if(x.draft)localStorage.f1qualidraft=JSON.stringify(x.draft);else localStorage.removeItem('f1qualidraft');location.reload()};render();renderSetups();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
