<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071220"><link rel="manifest" href="manifest.json"><link rel="icon" href="appicon-192.png"><title>RaceCompanion 25/26 v1.12.2</title><style>
*{box-sizing:border-box}html{background:#06101c}body{margin:0;color:#fff;font-family:Arial,sans-serif;background:#06101c url('background.png') center top/cover fixed no-repeat}#app{max-width:520px;margin:auto;min-height:100vh;padding:12px 12px 96px;background:linear-gradient(180deg,rgba(4,12,23,.16),rgba(5,10,18,.12))}.page{display:none}.page.on{display:block}header{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:4;margin:-12px -12px 10px;padding:10px 12px;background:rgba(8,18,31,.46);border-bottom:1px solid rgba(255,255,255,.22);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}header img{width:32px;height:32px;border-radius:8px}.brand{font:bold italic 14px Arial Black,Arial}.brand b{color:#f13b43}.ver{margin-left:auto;color:#b9c3cf;font-size:9px}h1{font:bold italic 25px Arial Black,Arial;margin:14px 0 3px;text-transform:uppercase;letter-spacing:-1px}.country{font:700 10px Arial;letter-spacing:3px;color:#d5dce5}.glass{background:linear-gradient(145deg,rgba(42,53,69,.58),rgba(17,26,39,.43));border:1px solid rgba(255,255,255,.30);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 12px 30px rgba(0,0,0,.27);backdrop-filter:blur(20px) saturate(145%);-webkit-backdrop-filter:blur(20px) saturate(145%);overflow:hidden;margin-top:12px}.pad{padding:13px}.hero{width:100%;aspect-ratio:16/9;display:block;object-fit:cover}.mapbox{height:162px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,rgba(39,50,67,.67),rgba(14,22,35,.52));border-top:1px solid rgba(255,255,255,.16)}.mapimg{width:74%;height:77%;object-fit:contain;filter:grayscale(1) brightness(2.6) contrast(2.0);mix-blend-mode:screen;opacity:.84;border-radius:50%}.caption{text-align:center;color:#b8c2cf;font-size:9px;margin-top:-23px;margin-bottom:15px;position:relative}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{text-align:center;padding:12px 6px;border-radius:14px;background:rgba(16,26,40,.48);border:1px solid rgba(255,255,255,.18)}.metric span{display:block;color:#c4ccd6;font-size:8px;font-weight:800}.metric strong{font:bold italic 18px Arial Black,Arial;font-variant-numeric:tabular-nums}label{display:block;color:#c8d0da;font-size:9px;font-weight:bold;text-transform:uppercase;margin:9px 0 4px}input,select{width:100%;padding:12px;background:rgba(8,17,29,.55);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:11px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary,.secondary,.navbtn{width:100%;border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:13px;color:#fff;font:bold italic 13px Arial Black,Arial}.primary{background:linear-gradient(#f3444d,#bc0010);box-shadow:inset 0 1px rgba(255,255,255,.32),0 7px 20px rgba(180,0,15,.25)}.secondary{background:rgba(45,58,76,.7)}.nav{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:500px;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border:1px solid rgba(255,255,255,.28);border-radius:26px;background:rgba(19,29,43,.58);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:9}.nav button{border:0;background:none;color:#b7c0cb;padding:5px;font-size:9px}.nav button span{display:block;font-size:17px}.nav button.on{background:rgba(220,14,26,.34);border-radius:18px;color:#fff}.trackCard{cursor:pointer}.trackTitle{padding:11px 12px}.trackTitle b{font:bold italic 17px Arial Black,Arial}.trackCard .hero{aspect-ratio:16/8.5}.pbrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px}.status{padding:8px 10px;border-left:3px solid #f13b43;background:rgba(22,31,44,.68);margin-top:9px}.listline{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.13)}.danger{background:rgba(90,14,20,.55);border:1px solid #a94046;color:white;border-radius:12px;padding:10px;width:100%;margin-top:10px}
</style></head><body><main id="app"><header><img src="appicon-192.png"><span class="brand">RACECOMPANION <b>25/26</b></span><span class="ver">v1.12.2</span></header>
<section id="home" class="page on"><h1 id="hello">Race Weekend</h1><div id="homeStats" class="metrics"></div><div class="glass pad"><b>LETZTES ERGEBNIS</b><div id="last"></div><button class="primary" data-go="entry">RENNEN EINTRAGEN</button></div></section>
<section id="entry" class="page"><h1>Rennen erfassen</h1><div id="draftBanner"></div><div class="glass pad"><label>Fahrername</label><input id="driver"><label>Strecke</label><select id="track"></select><label>Team</label><select id="team"></select><div class="row"><div><label>Qualifying Platz</label><select id="qp"></select></div><div><label>Qualifying Zeit</label><input id="qt" inputmode="numeric" pattern="[0-9]*" placeholder="142580"></div></div><button id="saveQ" class="secondary" style="margin-top:12px">QUALIFYING ZWISCHENSPEICHERN</button><hr style="border-color:rgba(255,255,255,.12);margin:16px 0"><div class="row"><div><label>Rennplatz</label><select id="rp"></select></div><div><label>Schnellste Runde</label><input id="rt" inputmode="numeric" pattern="[0-9]*" placeholder="145219"></div></div><button id="saveRace" class="primary" style="margin-top:12px">RENNWOCHENENDE SPEICHERN</button><div id="entryMsg"></div></div></section>
<section id="tracks" class="page"><h1>Strecken</h1><div class="glass pad"><input id="search" placeholder="Strecke suchen"></div><div id="trackList"></div></section>
<section id="detail" class="page"><button class="secondary" data-go="tracks" style="width:auto;padding:8px 11px">‹ Strecken</button><div id="detailBody"></div></section>
<section id="stats" class="page"><h1>Statistik</h1><div id="statsBody"></div></section>
<section id="more" class="page"><h1>Mehr</h1><div class="glass pad"><button class="secondary" data-go="setups">SETUPS</button><button class="secondary" data-go="data" style="margin-top:8px">DATEN / BACKUP</button></div></section>
<section id="setups" class="page"><h1>Setups</h1><div class="glass pad"><label>Strecke</label><select id="setupTrack"></select><label>Name</label><input id="setupName" placeholder="Race Dry"><label>Notizen</label><input id="setupNote"><button id="saveSetup" class="primary" style="margin-top:10px">SETUP SPEICHERN</button></div><div id="setupList"></div><button class="danger" data-go="more">Zurück</button></section>
<section id="data" class="page"><h1>Daten</h1><div class="glass pad"><button id="exportBtn" class="primary">BACKUP EXPORTIEREN</button><label>Backup importieren</label><input id="importFile" type="file" accept=".json,application/json"></div><button class="danger" data-go="more">Zurück</button></section></main>
<nav class="nav"><button class="on" data-go="home"><span>⌂</span>Home</button><button data-go="entry"><span>🏁</span>Rennen</button><button data-go="tracks"><span>◉</span>Strecken</button><button data-go="stats"><span>▥</span>Statistik</button><button data-go="more"><span>☰</span>Mehr</button></nav>
<script>'use strict';const TRACKS=["Australien · Melbourne", "China · Shanghai", "Japan · Suzuka", "Bahrain · Sakhir", "Saudi-Arabien · Jeddah", "USA · Miami", "Italien · Imola", "Monaco · Monte Carlo", "Spanien · Barcelona", "Kanada · Montreal", "Österreich · Red Bull Ring", "Großbritannien · Silverstone", "Belgien · Spa-Francorchamps", "Ungarn · Hungaroring", "Niederlande · Zandvoort", "Italien · Monza", "Aserbaidschan · Baku", "Singapur · Marina Bay", "USA · Austin", "Mexiko · Mexico City", "Brasilien · Interlagos", "USA · Las Vegas", "Katar · Lusail", "Abu Dhabi · Yas Marina", "Spanien · Madrid"],KEYS=["melbourne", "shanghai", "suzuka", "bahrain", "jeddah", "miami", "imola", "monaco", "barcelona", "montreal", "red-bull-ring", "silverstone", "spa-francorchamps", "hungaroring", "zandvoort", "monza", "baku", "singapore", "austin", "mexico-city", "interlagos", "las-vegas", "lusail", "yas-marina", ""],PTS={P1:25,P2:18,P3:15,P4:12,P5:10,P6:8,P7:6,P8:4,P9:2,P10:1};const $=id=>document.getElementById(id);function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}let races=get('f1races',[]),setups=get('f1setups',[]),draft=get('f1qualidraft',null);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(v){v=(v||'').trim();if(/^\d{4,7}$/.test(v)){let ms=v.slice(-3),b=v.slice(0,-3),sec=b.slice(-2),min=b.slice(0,-2)||'0';if(+sec<60)return `${min}:${sec}.${ms}`}return v}function sec(v){let m=norm(v).match(/^(\d+):([0-5]?\d)\.(\d{1,3})$/);return m?+m[1]*60 + +m[2]+ +(m[3].padEnd(3,'0'))/1000:null}function best(a,k){return a.filter(x=>sec(x[k])!==null).sort((x,y)=>sec(x[k])-sec(y[k]))[0]?.[k]||'—'}function sname(t){return (t||'').split(' · ')[1]||t}function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.go===id));render();scrollTo(0,0)}document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
$('track').innerHTML=TRACKS.map(x=>`<option>${x}</option>`).join('');$('setupTrack').innerHTML=$('track').innerHTML;['Ferrari','McLaren','Mercedes','Red Bull Racing','Aston Martin','Williams','Alpine','Haas','Racing Bulls','Sauber','Audi'].forEach(x=>$('team').add(new Option(x,x)));for(let i=1;i<=20;i++){$('qp').add(new Option('P'+i,'P'+i));$('rp').add(new Option('P'+i,'P'+i))}['DNF','DNS','DSQ'].forEach(x=>$('rp').add(new Option(x,x)));$('driver').value=localStorage.f1driver||'';['qt','rt'].forEach(id=>$(id).onblur=()=>{if(sec($(id).value)!==null)$(id).value=norm($(id).value)});
function draftToForm(){if(!draft)return;let i=TRACKS.indexOf(draft.track);if(i>=0)$('track').selectedIndex=i;$('driver').value=draft.driver||'';$('team').value=draft.team||$('team').value;$('qp').value=draft.qp||'P1';$('qt').value=draft.qt||''}draftToForm();$('saveQ').onclick=()=>{let d=$('driver').value.trim(),qt=norm($('qt').value);if(!d)return message('Bitte Fahrername eingeben.');if(sec(qt)===null)return message('Qualifying-Zeit nur als Zahlen, z. B. 142580.');draft={driver:d,track:$('track').value,team:$('team').value,qp:$('qp').value,qt,date:new Date().toLocaleDateString('de-DE')};localStorage.f1driver=d;localStorage.f1qualidraft=JSON.stringify(draft);message('✓ Qualifying zwischengespeichert. Rennen kann später ergänzt werden.');render()};$('saveRace').onclick=()=>{let d=$('driver').value.trim(),qt=norm($('qt').value),rt=norm($('rt').value);if(!d||sec(qt)===null)return message('Bitte zuerst ein gültiges Qualifying eintragen.');if(sec(rt)===null)return message('Bitte eine gültige Rennrunde eintragen.');races.push({driver:d,track:$('track').value,team:$('team').value,qp:$('qp').value,qt,rp:$('rp').value,rt,date:new Date().toLocaleDateString('de-DE')});localStorage.f1driver=d;localStorage.f1races=JSON.stringify(races);localStorage.removeItem('f1qualidraft');draft=null;message('✓ Rennwochenende gespeichert.');render()};function message(t){$('entryMsg').className='status';$('entryMsg').textContent=t}
$('search').oninput=renderTracks;function renderTracks(){let q=$('search').value.toLowerCase(),g={};races.forEach(x=>(g[x.track]??=[]).push(x));$('trackList').innerHTML=TRACKS.map((t,i)=>({t,i,a:g[t]||[]})).filter(x=>x.t.toLowerCase().includes(q)).map(({t,i,a})=>`<div class="glass trackCard" data-i="${i}"><div class="trackTitle"><b>${esc(sname(t))}</b><div class="country">${esc(t.split(' · ')[0].toUpperCase())}</div></div>${KEYS[i]?`<img class="hero" src="panorama-${KEYS[i]}.jpg">`:''}<div class="pbrow"><div class="metric"><span>QUALIFYING PB</span><strong>${best(a,'qt')}</strong></div><div class="metric"><span>RENNRUNDE PB</span><strong>${best(a,'rt')}</strong></div></div></div>`).join('')}document.addEventListener('click',e=>{let c=e.target.closest('.trackCard');if(c)openTrack(+c.dataset.i)});function openTrack(i){let t=TRACKS[i],a=races.filter(x=>x.track===t),k=KEYS[i],br=a.slice().sort((x,y)=>(parseInt(x.rp.slice(1))||99)-(parseInt(y.rp.slice(1))||99))[0]?.rp||'—';$('detailBody').innerHTML=`<h1>${esc(sname(t))}</h1><div class="country">${esc(t.split(' · ')[0].toUpperCase())}</div>${k?`<div class="glass"><img class="hero" src="panorama-${k}.jpg"><div class="mapbox"><img class="mapimg" src="map-${k}.jpg"></div><div class="caption">Schematische Streckenkarte</div><div class="pbrow"><div class="metric"><span>QUALIFYING PB</span><strong>${best(a,'qt')}</strong></div><div class="metric"><span>RENNRUNDE PB</span><strong>${best(a,'rt')}</strong></div></div><div class="pad metrics"><div class="metric"><strong>${a.length}</strong><span>RENNEN</span></div><div class="metric"><strong>${a.filter(x=>x.rp==='P1').length}</strong><span>SIEGE</span></div><div class="metric"><strong>${br}</strong><span>BESTES ERGEBNIS</span></div><div class="metric"><strong>${setups.filter(x=>x.track===t).length}</strong><span>SETUPS</span></div></div></div>`:''}<button class="primary" id="fromDetail" style="margin-top:10px">RENNEN EINTRAGEN</button>`;$('fromDetail').onclick=()=>{$('track').selectedIndex=i;go('entry')};go('detail')}
function render(){let total=races.reduce((a,x)=>a+(PTS[x.rp]||0),0),wins=races.filter(x=>x.rp==='P1').length,pods=races.filter(x=>['P1','P2','P3'].includes(x.rp)).length;$('hello').textContent=(localStorage.f1driver?`Guten Abend, ${localStorage.f1driver}`:'DEIN RACE WEEKEND');$('homeStats').innerHTML=`<div class="metric"><strong>${total}</strong><span>PUNKTE</span></div><div class="metric"><strong>${wins}</strong><span>SIEGE</span></div><div class="metric"><strong>${pods}</strong><span>PODIEN</span></div><div class="metric"><strong>${races.length}</strong><span>RENNEN</span></div>`;let l=races.at(-1);$('last').innerHTML=l?`<div class="listline"><b>${esc(sname(l.track))} · ${esc(l.team)}</b><br>Qualifying ${l.qp} → Rennen ${l.rp}</div>`:'<p>Noch kein Rennen.</p>';$('draftBanner').innerHTML=draft?`<div class="status"><b>QUALIFYING GESPEICHERT</b><br>${esc(sname(draft.track))} · ${draft.qp} · ${draft.qt}<br>Rennen noch offen.</div>`:'';renderTracks();let ranks=Object.entries(PTS).map(([p,v])=>`<div class="listline">${p}<b style="float:right">${races.filter(x=>x.rp===p).length}× · ${races.filter(x=>x.rp===p).length*v} Pkt.</b></div>`).join('');$('statsBody').innerHTML=`<div class="glass pad"><div class="metrics"><div class="metric"><strong>${races.length}</strong><span>RENNEN</span></div><div class="metric"><strong>${total}</strong><span>PUNKTE</span></div><div class="metric"><strong>${wins}</strong><span>SIEGE</span></div><div class="metric"><strong>${pods}</strong><span>PODIEN</span></div></div></div><div class="glass pad"><b>PUNKTERÄNGE</b>${ranks}</div>`}$('driver').oninput=()=>localStorage.f1driver=$('driver').value;
$('saveSetup').onclick=()=>{let n=$('setupName').value.trim();if(!n)return;setups.push({id:Date.now(),track:$('setupTrack').value,name:n,note:$('setupNote').value.trim()});localStorage.f1setups=JSON.stringify(setups);renderSetups()};function renderSetups(){$('setupList').innerHTML=setups.filter(x=>x.track===$('setupTrack').value).map(x=>`<div class="glass pad"><b>${esc(x.name)}</b><br>${esc(x.note||'')}</div>`).join('')||'<div class="glass pad">Noch kein Setup.</div>'}$('setupTrack').onchange=renderSetups;$('exportBtn').onclick=()=>{let a=document.createElement('a'),b=new Blob([JSON.stringify({driver:localStorage.f1driver||'',races,setups},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='RaceCompanion_Backup.json';a.click()};$('importFile').onchange=async e=>{let x=JSON.parse(await e.target.files[0].text());localStorage.f1driver=x.driver||'';localStorage.f1races=JSON.stringify(x.races||[]);localStorage.f1setups=JSON.stringify(x.setups||[]);location.reload()};render();renderSetups();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
