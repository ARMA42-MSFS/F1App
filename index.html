<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15151e"><link rel="manifest" href="manifest.json"><link rel="icon" href="racecompanion-icon-v3-192.png"><title>RaceCompanion 25/26 · v1.11.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#08080c url('f1-app-background.png') center top/cover fixed no-repeat;color:#fff;font-family:Arial,sans-serif}#app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#0b0b10f7,#101016fa);padding:14px 14px 92px}header{display:flex;gap:9px;align-items:center;border-bottom:3px solid #e10600;padding:6px 0 12px}.logo{width:46px;height:46px;border-radius:11px}.brand{font:bold italic 18px Arial Black,Arial}.brand b{color:#e10600}.version{margin-left:auto;color:#aaa;font-size:10px}h1{font:bold italic 27px Arial Black,Arial;text-transform:uppercase;border-bottom:2px solid #e10600;padding-bottom:8px}.sub{color:#aaa;font-size:12px}.page{display:none}.page.on{display:block}.card{position:relative;background:#191920;border:1px solid #484852;border-radius:11px;padding:14px;margin-top:12px;overflow:hidden}.card:after{content:"";position:absolute;right:0;top:0;width:40px;height:5px;background:#e10600}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#202027;border:1px solid #45454f;border-radius:8px;padding:14px;text-align:center;font-size:11px;text-transform:uppercase}.metric strong{display:block;font:bold italic 25px Arial Black,Arial}label{display:block;margin:10px 0 5px;color:#bbb;font-size:10px;font-weight:bold;text-transform:uppercase}input,select{width:100%;padding:13px;background:#0b0b10;color:#fff;border:1px solid #555560;border-radius:7px;font-size:16px}.primary,.menuBtn{width:100%;border:0;border-radius:7px;background:#e10600;color:white;padding:14px;font:bold italic 14px Arial Black,Arial;margin-top:12px}.menuBtn{margin:0}.trackimg{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:9px;background:#101016;margin-top:12px}.history{padding:10px 0;border-bottom:1px solid #393942}.gold{color:#ffe05c}.notice{padding:9px;margin-top:10px;border-left:4px solid #e10600;background:#22222a}.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#0b0b10f8;border-top:1px solid #444;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 3px 10px}.nav button{border:0;background:none;color:#aaa;font-size:10px;padding:5px}.nav button span{display:block;font-size:18px}.nav button.on{color:#fff;border-top:3px solid #e10600}.setupTitle{color:#ff4d45;font:bold 13px Arial Black,Arial}.danger{width:100%;padding:12px;border:1px solid #812e33;border-radius:7px;background:#290d10;color:#ff969a;margin-top:14px}.hidden{display:none}
</style></head><body><main id="app"><header><img class="logo" src="racecompanion-icon-v3-192.png"><span class="brand">RACECOMPANION <b>25/26</b></span><span class="version">v1.11.3 FIX</span></header>
<section id="dashboard" class="page on"><h1>Home</h1><div class="sub" id="dashName"></div><div id="dashMetrics" class="metrics" style="margin-top:12px"></div><div class="card"><b>LETZTES ERGEBNIS</b><div id="lastRace"></div><button class="primary" data-go="entry">RENNEN EINTRAGEN</button></div><div id="formCard"></div></section>
<section id="entry" class="page"><h1>Rennen erfassen</h1><div class="card"><label>Fahrername</label><input id="driver"><label>Strecke</label><select id="track"></select><img id="trackImg" class="trackimg"><label>Team</label><select id="team"></select><div class="row"><div><label>Qualifying</label><select id="qp"></select><label>Qualifying-Zeit</label><input id="qt" inputmode="numeric" pattern="[0-9]*" placeholder="142580 → 1:42.580"></div><div><label>Rennen</label><select id="rp"></select><label>Schnellste Runde</label><input id="rt" inputmode="numeric" pattern="[0-9]*" placeholder="145219 → 1:45.219"></div></div><button id="saveRace" class="primary">ERGEBNIS SPEICHERN</button><div id="raceMsg"></div></div></section>
<section id="circuits" class="page"><h1>Strecken</h1><div id="circuitList"></div></section>
<section id="stats" class="page"><h1>Statistik</h1><div id="statsMetrics" class="metrics"></div><div class="card"><b>PUNKTERÄNGE</b><div id="pointsRanks"></div></div><div class="card"><b>RENNHISTORIE</b><div id="history"></div></div></section>
<section id="more" class="page"><h1>Mehr</h1><label>Saison</label><select id="season"><option>2025</option><option selected>2026</option><option>Eigene Saison</option></select><div class="card"><div class="row"><button class="menuBtn" data-go="setups">SETUPS</button><button class="menuBtn" data-go="records">RECORDS</button><button class="menuBtn" data-go="champ">CHAMPIONSHIP</button><button class="menuBtn" data-go="data">DATEN</button></div></div><div id="seasonSummary"></div></section>
<section id="setups" class="page"><h1>Auto-Setup</h1><div class="sub">Vollständige Spielkategorien · je Strecke</div><div class="card"><label>Strecke</label><select id="setupTrack"></select><label>Setup-Name</label><input id="setupName" placeholder="z. B. Race Dry"><label>Session</label><select id="setupType"><option>Rennen Trocken</option><option>Qualifying</option><option>Regen</option></select></div><div id="setupFields"></div><button id="saveSetup" class="primary">SETUP SPEICHERN</button><div id="setupMsg"></div><div id="setupList"></div><button class="danger" data-go="more">ZURÜCK</button></section>
<section id="records" class="page"><h1>Records</h1><div id="recordsBody"></div><button class="danger" data-go="more">ZURÜCK</button></section>
<section id="champ" class="page"><h1>Championship</h1><div id="champSummary" class="card"></div><div id="champRounds"></div><button class="danger" data-go="more">ZURÜCK</button></section>
<section id="data" class="page"><h1>Daten</h1><div class="card"><button id="exportBtn" class="primary">BACKUP EXPORTIEREN</button><label>Backup importieren</label><input id="importFile" type="file" accept="application/json,.json"><button id="resetBtn" class="danger">AKTUELLE SAISON ZURÜCKSETZEN</button><div id="dataMsg"></div></div><button class="danger" data-go="more">ZURÜCK</button></section></main>
<nav class="nav"><button class="on" data-go="dashboard"><span>⌂</span>Home</button><button data-go="entry"><span>🏁</span>Rennen</button><button data-go="circuits"><span>◉</span>Strecken</button><button data-go="stats"><span>▥</span>Statistik</button><button data-go="more"><span>☰</span>Mehr</button></nav>
<script>
'use strict';
const TRACKS=["Australien · Melbourne", "China · Shanghai", "Japan · Suzuka", "Bahrain · Sakhir", "Saudi-Arabien · Jeddah", "USA · Miami", "Italien · Imola", "Monaco · Monte Carlo", "Spanien · Barcelona", "Kanada · Montreal", "Österreich · Red Bull Ring", "Großbritannien · Silverstone", "Belgien · Spa-Francorchamps", "Ungarn · Hungaroring", "Niederlande · Zandvoort", "Italien · Monza", "Aserbaidschan · Baku", "Singapur · Marina Bay", "USA · Austin", "Mexiko · Mexico City", "Brasilien · Interlagos", "USA · Las Vegas", "Katar · Lusail", "Abu Dhabi · Yas Marina", "Spanien · Madrid"], IMGS=["melbourne", "shanghai", "suzuka", "bahrain", "jeddah", "miami", "imola", "monaco", "barcelona", "montreal", "red-bull-ring", "silverstone", "spa-francorchamps", "hungaroring", "zandvoort", "monza", "baku", "singapore", "austin", "mexico-city", "interlagos", "las-vegas", "lusail", "yas-marina", ""], PTS={P1:25,P2:18,P3:15,P4:12,P5:10,P6:8,P7:6,P8:4,P9:2,P10:1};
const $=id=>document.getElementById(id); let races=safe('f1races',[]),setups=safe('f1setups',[]); function safe(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function norm(v){v=(v||'').trim();if(/^\d{4,7}$/.test(v)){let ms=v.slice(-3),b=v.slice(0,-3),sec=b.slice(-2),min=b.slice(0,-2)||'0';if(+sec<60)return `${min}:${sec}.${ms}`}return v}function seconds(v){let m=norm(v).match(/^(\d+):([0-5]?\d)\.(\d{1,3})$/);return m?+m[1]*60 + +m[2]+ +(m[3].padEnd(3,'0'))/1000:null}function best(a,k){return a.filter(x=>seconds(x[k])!==null).sort((x,y)=>seconds(x[k])-seconds(y[k]))[0]?.[k]||'—'}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id)?.classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.go===id));if(id==='setups')renderSetups();render();scrollTo(0,0)} document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go)}});
$('track').innerHTML=TRACKS.map(x=>`<option>${x}</option>`).join('');$('setupTrack').innerHTML=$('track').innerHTML;['Ferrari','McLaren','Mercedes','Red Bull Racing','Aston Martin','Williams','Alpine','Haas','Racing Bulls','Sauber','Audi'].forEach(x=>$('team').add(new Option(x,x)));for(let i=1;i<=20;i++){$('qp').add(new Option('P'+i,'P'+i));$('rp').add(new Option('P'+i,'P'+i))}['DNF','DNS','DSQ'].forEach(x=>$('rp').add(new Option(x,x)));$('driver').value=localStorage.f1driver||'';
function trackImage(){let i=$('track').selectedIndex;if(IMGS[i]){$('trackImg').src='track-'+IMGS[i]+'.jpg';$('trackImg').style.display='block'}else $('trackImg').style.display='none'}$('track').addEventListener('change',trackImage);trackImage();['qt','rt'].forEach(id=>$(id).addEventListener('blur',()=>{if(seconds($(id).value)!==null)$(id).value=norm($(id).value)}));
$('saveRace').addEventListener('click',()=>{let d=$('driver').value.trim();if(!d)return msg('raceMsg','Bitte Fahrername eingeben.');if(seconds($('qt').value)===null||seconds($('rt').value)===null)return msg('raceMsg','Zeit als Ziffern eingeben, z. B. 142580.');let old=best(races.filter(x=>x.track===$('track').value),'rt');races.push({track:$('track').value,team:$('team').value,qp:$('qp').value,qt:norm($('qt').value),rp:$('rp').value,rt:norm($('rt').value),date:new Date().toLocaleDateString('de-DE'),season:$('season').value});localStorage.f1driver=d;localStorage.f1races=JSON.stringify(races);msg('raceMsg',old==='—'||seconds(norm($('rt').value))<seconds(old)?'🏆 Neuer persönlicher Streckenrekord!':'✓ Ergebnis gespeichert');render()});
const GROUPS=[['AERODYNAMIK',[['Frontflügel','fw'],['Heckflügel','rw']]],['GETRIEBE',[['Differential On-Throttle %','don'],['Differential Off-Throttle %','doff']]],['RADAUFHÄNGUNGSGEOMETRIE',[['Sturz vorne','cf'],['Sturz hinten','cr'],['Spur vorne','tf'],['Spur hinten','tr']]],['RADAUFHÄNGUNG',[['Federung vorne','sf'],['Federung hinten','sr'],['Stabilisator vorne','af'],['Stabilisator hinten','ar'],['Bodenfreiheit vorne','hf'],['Bodenfreiheit hinten','hr']]],['BREMSEN',[['Bremsdruck %','bp'],['Bremsbalance vorne %','bb']]],['REIFEN',[['Druck vorne links psi','fl'],['Druck vorne rechts psi','fr'],['Druck hinten links psi','rl'],['Druck hinten rechts psi','rr']]]];$('setupFields').innerHTML=GROUPS.map(([g,fs])=>`<div class="card"><div class="setupTitle">${g}</div><div class="row">${fs.map(([l,id])=>`<div><label>${l}</label><input id="su_${id}" inputmode="decimal"></div>`).join('')}</div></div>`).join('')+'<div class="card"><label>Notizen</label><input id="su_note"></div>';
$('saveSetup').addEventListener('click',()=>{let name=$('setupName').value.trim();if(!name)return msg('setupMsg','Bitte Setup-Namen eingeben.');let values={};GROUPS.flatMap(x=>x[1]).forEach(([,id])=>values[id]=$('su_'+id).value.trim());setups.push({id:Date.now(),track:$('setupTrack').value,name,type:$('setupType').value,values,note:$('su_note').value.trim()});localStorage.f1setups=JSON.stringify(setups);msg('setupMsg','✓ Setup gespeichert');renderSetups()});$('setupTrack').addEventListener('change',renderSetups);function renderSetups(){let a=setups.filter(x=>x.track===$('setupTrack').value);$('setupList').innerHTML=a.length?a.map(x=>`<div class="card"><b>${esc(x.name)}</b> · <span class="sub">${esc(x.type)}</span>${GROUPS.map(([g,fs])=>`<div class="history"><b>${g}</b><br><span class="sub">${fs.map(([l,id])=>`${l}: ${esc(x.values?.[id]||'—')}`).join(' · ')}</span></div>`).join('')}<button class="danger" data-del="${x.id}">LÖSCHEN</button></div>`).join(''):'<div class="card">Noch kein Setup für diese Strecke.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{setups=setups.filter(x=>String(x.id)!==b.dataset.del);localStorage.f1setups=JSON.stringify(setups);renderSetups()})}
function render(){let d=localStorage.f1driver||$('driver').value||'Fahrer',yr=$('season').value,total=races.reduce((a,x)=>a+(PTS[x.rp]||0),0),wins=races.filter(x=>x.rp==='P1').length,pods=races.filter(x=>['P1','P2','P3'].includes(x.rp)).length,poles=races.filter(x=>x.qp==='P1').length;$('dashName').textContent=`${d} · Saison ${yr}`;$('dashMetrics').innerHTML=metrics([[total,'Punkte'],[wins,'Siege'],[pods,'Podien'],[poles,'Poles']]);let lr=races.at(-1);$('lastRace').innerHTML=lr?`<div class="history"><b>${short(lr.track)}</b><span class="gold" style="float:right">Q ${lr.qp} → ${lr.rp}</span><br><span class="sub">${esc(lr.team)} · ${esc(lr.date)}</span></div>`:'<p>Noch kein Rennen gespeichert.</p>';let l5=races.slice(-5);$('formCard').innerHTML=`<div class="card"><b>FAHRERFORM · LETZTE 5</b><p>${l5.map(x=>`<b style="margin-right:10px">${x.rp}</b>`).join('')||'—'}</p><span class="sub">${l5.reduce((a,x)=>a+(PTS[x.rp]||0),0)} Punkte</span></div>`;
let groups={};races.forEach(x=>(groups[x.track]??=[]).push(x));$('circuitList').innerHTML=TRACKS.map((t,i)=>{let a=groups[t]||[];return `<div class="card">${IMGS[i]?`<img class="trackimg" src="track-${IMGS[i]}.jpg">`:''}<b>${short(t)}</b><div class="row"><div><label>Qualifying PB</label><strong>${best(a,'qt')}</strong></div><div><label>Race PB</label><strong class="gold">${best(a,'rt')}</strong></div></div></div>`}).join('');$('statsMetrics').innerHTML=metrics([[races.length,'Rennen'],[total,'Punkte'],[wins,'Siege'],[pods,'Podien'],[poles,'Poles'],[races.filter(x=>PTS[x.rp]).length,'Punkteränge']]);$('pointsRanks').innerHTML=Object.entries(PTS).map(([p,v])=>`<div class="history">${p}<b style="float:right">${races.filter(x=>x.rp===p).length}× · ${races.filter(x=>x.rp===p).length*v} Pkt.</b></div>`).join('');$('history').innerHTML=races.slice().reverse().map(x=>`<div class="history"><b>${short(x.track)}</b><b style="float:right">${x.rp} · ${PTS[x.rp]||0} Pkt.</b><br><span class="sub">${esc(x.team)} · Q ${x.qp} · ${esc(x.date)}</span></div>`).join('')||'Noch keine Rennen.';
let sr=races.filter(x=>(x.season||'2026')===yr),sp=sr.reduce((a,x)=>a+(PTS[x.rp]||0),0);$('seasonSummary').innerHTML=`<div class="card"><b>${d}</b>${metrics([[sr.length,'Rennen'],[sp,'Punkte'],[sr.filter(x=>x.rp==='P1').length,'Siege'],[sr.filter(x=>['P1','P2','P3'].includes(x.rp)).length,'Podien']])}</div>`;let gains=races.map(x=>num(x.qp)&&num(x.rp)?num(x.qp)-num(x.rp):null).filter(x=>x!==null),net=gains.reduce((a,b)=>a+b,0);$('recordsBody').innerHTML=metrics([[poles,'Poles'],[Math.max(0,...gains),'+ Positionen'],[best(races,'qt'),'Qualifying PB'],[best(races,'rt'),'Race PB']])+`<div class="card"><b>POSITIONSBILANZ</b><h2>${net>=0?'+':''}${net}</h2></div>`;$('champSummary').innerHTML=`<b>${sr.length} / ${TRACKS.length} Rennen</b><h2>${sp} WM-Punkte</h2><div style="height:8px;background:#333"><div style="height:100%;width:${Math.min(100,sr.length/TRACKS.length*100)}%;background:#e10600"></div></div>`;$('champRounds').innerHTML=TRACKS.map((t,i)=>{let x=sr.find(r=>r.track===t);return `<div class="card"><b>ROUND ${i+1} · ${short(t)}</b><b style="float:right">${x?x.rp+' · '+(PTS[x.rp]||0)+' Pkt.':'OFFEN'}</b></div>`}).join('')}
$('season').addEventListener('change',render);$('driver').addEventListener('input',()=>{localStorage.f1driver=$('driver').value;render()});
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:'1.11.3',driver:localStorage.f1driver||'',races,setups},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RaceCompanion_Backup.json';a.click()};$('importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.races)||!Array.isArray(x.setups))throw 0;localStorage.f1driver=x.driver||'';localStorage.f1races=JSON.stringify(x.races);localStorage.f1setups=JSON.stringify(x.setups);location.reload()}catch{msg('dataMsg','Ungültige Backup-Datei.')}};$('resetBtn').onclick=()=>{let y=$('season').value;if(confirm('Saison '+y+' wirklich zurücksetzen?')){races=races.filter(x=>(x.season||'2026')!==y);localStorage.f1races=JSON.stringify(races);render();msg('dataMsg','✓ Saison zurückgesetzt')}};
function num(x){return /^P\d+$/.test(x||'')?+x.slice(1):null}function short(t){return esc((t||'').split(' · ')[1]||t)}function metrics(a){return `<div class="metrics">${a.map(x=>`<div class="metric"><strong>${x[0]}</strong>${x[1]}</div>`).join('')}</div>`}function msg(id,t){$(id).className='notice';$(id).textContent=t}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();renderSetups();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
