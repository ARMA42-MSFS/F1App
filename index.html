<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06172b"><title>F1 RaceCompanion 25/26</title><style>
*{box-sizing:border-box}body{margin:0;background:#03101f;color:#f7fbff;font-family:Arial,sans-serif}#app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#071d34,#020a13);padding:18px 15px 92px}.brand{font-style:italic;font-weight:1000;letter-spacing:-1px;font-size:20px}.brand b{color:#24e4f5}.logo{display:inline-grid;place-items:center;width:50px;height:40px;border:2px solid #13d8ee;border-radius:13px;margin-right:9px;color:white;font-size:25px;font-weight:1000;font-style:italic;box-shadow:0 0 15px #13d8ee55}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:#06172bf5;border-top:1px solid #17425f;padding:8px 6px 12px}.nav button{background:none;border:0;color:#a9bfd4;font-size:12px}.nav button span{display:block;font-size:22px}.nav .on{color:#25e4f5}.page{display:none}.page.on{display:block}h1{font-style:italic;font-weight:1000;font-size:28px;margin:22px 0 3px}small{color:#91aac2}.card{background:linear-gradient(145deg,#0a263f,#061626);border:1px solid #1e4968;border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 8px 28px #0006}.trackart{height:180px;border-radius:14px;margin:12px 0;background:radial-gradient(circle at 45% 50%,#153b42,#051426 66%);display:grid;place-items:center;overflow:hidden}.circuit{width:78%;height:55%;border:9px solid #22e6f1;border-right-color:#ff2463;border-bottom-color:#ffd443;border-radius:48% 30% 55% 40%;transform:rotate(-9deg) skew(-6deg);box-shadow:0 0 12px #1decff,0 12px 0 #17344a,0 18px 20px #000}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#9bb2c6;font-size:12px;margin:9px 0 5px}input,select{width:100%;padding:13px;background:#061321;color:white;border:1px solid #315774;border-radius:11px;font-size:16px}.primary{width:100%;border:0;border-radius:13px;padding:15px;margin-top:16px;background:linear-gradient(90deg,#ff174f,#ff315d);color:white;font-weight:900;font-style:italic;font-size:16px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:16px;border-radius:14px;background:linear-gradient(145deg,#0b7d93,#07586c);text-align:center}.metric:nth-child(2){background:linear-gradient(145deg,#b18a20,#645015)}.metric:nth-child(3){background:linear-gradient(145deg,#c51f53,#6e1133)}.metric:nth-child(4){background:linear-gradient(145deg,#783ac5,#3e1c72)}.metric strong{display:block;font-size:29px}.record{display:flex;justify-content:space-between;gap:10px;align-items:center}.record strong{color:#ffe54f}.history{padding:10px 0;border-bottom:1px solid #24425c}.notice{color:#58f39c;text-align:center;margin:10px}
</style></head><body><main id="app"><header><span class="logo">F1</span><span class="brand">RACECOMPANION <b>25/26</b></span></header>
<section id="start" class="page on"><h1>Rennen erfassen</h1><small id="hello">Deine Saison auf PS5</small><div class="card"><label>Fahrername</label><input id="driver" placeholder="Dein Name"><label>Strecke</label><select id="track"></select><div class="trackart"><div class="circuit"></div></div><label>Team</label><select id="team"><option>Ferrari</option><option>McLaren</option><option>Mercedes</option><option>Red Bull Racing</option><option>Aston Martin</option><option>Williams</option><option>Alpine</option><option>Haas</option><option>Racing Bulls</option><option>Sauber</option></select><div class="row"><div><label>Qualifying Platz</label><select id="qp"></select><label>Qualifying Zeit</label><input id="qt" placeholder="1:42.580" inputmode="decimal"></div><div><label>Rennplatz</label><select id="rp"></select><label>Schnellste Rennrunde</label><input id="rt" placeholder="1:45.219" inputmode="decimal"></div></div><button class="primary" id="save">ERGEBNIS SPEICHERN ›</button><div id="msg" class="notice"></div></div></section>
<section id="records" class="page"><h1>Streckenrekorde</h1><small>Deine persönlichen Bestzeiten</small><div id="recordList"></div></section>
<section id="stats" class="page"><h1>Deine Statistik</h1><small>Automatisch aus deinen Rennen</small><div id="metrics" class="metrics" style="margin-top:16px"></div><div class="card"><b>RENNHISTORIE</b><div id="history"></div></div></section>
<section id="season" class="page"><h1>Saison</h1><small>Persönliche Übersicht</small><div class="card"><h2 id="seasonName">Noch kein Fahrer</h2><p>Alle gespeicherten Ergebnisse bleiben lokal auf diesem Gerät gespeichert.</p></div></section>
</main><nav class="nav"><button class="on" data-page="start"><span>⌂</span>Eintragen</button><button data-page="records"><span>🏆</span>Rekorde</button><button data-page="stats"><span>▥</span>Statistik</button><button data-page="season"><span>★</span>Saison</button></nav><script>
const tracks=['Australien · Melbourne','China · Shanghai','Japan · Suzuka','Bahrain · Sakhir','Saudi-Arabien · Jeddah','USA · Miami','Italien · Imola','Monaco · Monte Carlo','Spanien · Barcelona','Kanada · Montreal','Österreich · Red Bull Ring','Großbritannien · Silverstone','Belgien · Spa-Francorchamps','Ungarn · Hungaroring','Niederlande · Zandvoort','Italien · Monza','Aserbaidschan · Baku','Singapur · Marina Bay','USA · Austin','Mexiko · Mexico City','Brasilien · Interlagos','USA · Las Vegas','Katar · Lusail','Abu Dhabi · Yas Marina','Spanien · Madrid'];
track.innerHTML=tracks.map(x=>`<option>${x}</option>`).join(''); for(let i=1;i<=20;i++){qp.add(new Option('P'+i,'P'+i));rp.add(new Option('P'+i,'P'+i))}['DNF','DNS','DSQ'].forEach(x=>rp.add(new Option(x,x))); let races=JSON.parse(localStorage.f1races||'[]');driver.value=localStorage.f1driver||'';
function secs(v){let m=v.match(/^(\d+):([0-5]?\d)\.(\d{1,3})$/);return m?+m[1]*60 + +m[2] + +(m[3].padEnd(3,'0'))/1000:null}function best(arr,key){let x=arr.filter(r=>secs(r[key])!=null).sort((a,b)=>secs(a[key])-secs(b[key]));return x[0]?.[key]||'—'}
function render(){localStorage.f1driver=driver.value;hello.textContent=driver.value?driver.value+' · Race Companion':'Deine Saison auf PS5';seasonName.textContent=driver.value||'Noch kein Fahrer';let groups={};races.forEach(r=>(groups[r.track]??=[]).push(r));recordList.innerHTML=tracks.map(t=>{let a=groups[t]||[];return `<div class="card record"><div><b>${t.split(' · ')[1]}</b><br><small>${t.split(' · ')[0]}</small></div><div><small>Qualifying</small><br><strong>${best(a,'qt')}</strong><br><small>Rennrunde</small><br><strong>${best(a,'rt')}</strong></div></div>`}).join('');let wins=races.filter(r=>r.rp==='P1').length,podium=races.filter(r=>['P1','P2','P3'].includes(r.rp)).length,poles=races.filter(r=>r.qp==='P1').length;metrics.innerHTML=[[races.length,'Rennen'],[wins,'Siege'],[podium,'Podien'],[poles,'Poles']].map(x=>`<div class="metric"><strong>${x[0]}</strong>${x[1]}</div>`).join('');history.innerHTML=races.slice().reverse().map(r=>`<div class="history"><b>${r.track.split(' · ')[1]}</b> · ${r.rp}<br><small>${r.team} · Q ${r.qp} · ${r.date}</small></div>`).join('')||'<p>Noch keine Rennen gespeichert.</p>'}
save.onclick=()=>{if(!driver.value.trim()){msg.textContent='Bitte Fahrername eingeben.';return}if(secs(qt.value)==null||secs(rt.value)==null){msg.textContent='Zeit bitte z. B. als 1:42.580 eingeben.';return}races.push({track:track.value,team:team.value,qp:qp.value,qt:qt.value,rp:rp.value,rt:rt.value,date:new Date().toLocaleDateString('de-DE')}); localStorage.f1races=JSON.stringify(races);let old=best(races.slice(0,-1).filter(r=>r.track===track.value),'rt');msg.textContent=old==='—'||secs(rt.value)<secs(old)?'🏆 Neuer persönlicher Streckenrekord!':'✓ Ergebnis gespeichert';render()};driver.oninput=render;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page,.nav button').forEach(x=>x.classList.remove('on'));document.getElementById(b.dataset.page).classList.add('on');b.classList.add('on');render()});render();
</script></body></html>
