const $=id=>document.getElementById(id); let races=safe('f1races',[]),setups=safe('f1setups',[]); function safe(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}

$('track').innerHTML=TRACKS.map(x=>`<option>${x}</option>`).join('');$('setupTrack').innerHTML=$('track').innerHTML;['Ferrari','McLaren','Mercedes','Red Bull Racing','Aston Martin','Williams','Alpine','Haas','Racing Bulls','Sauber','Audi'].forEach(x=>$('team').add(new Option(x,x)));for(let i=1;i<=20;i++){$('qp').add(new Option('P'+i,'P'+i));$('rp').add(new Option('P'+i,'P'+i))}['DNF','DNS','DSQ'].forEach(x=>$('rp').add(new Option(x,x)));$('driver').value=localStorage.f1driver||'';

$('saveRace').addEventListener('click',()=>{let d=$('driver').value.trim();if(!d)return msg('raceMsg','Bitte Fahrername eingeben.');if(seconds($('qt').value)===null||seconds($('rt').value)===null)return msg('raceMsg','Zeit als Ziffern eingeben, z. B. 142580.');let old=best(races.filter(x=>x.track===$('track').value),'rt');races.push({track:$('track').value,team:$('team').value,qp:$('qp').value,qt:norm($('qt').value),rp:$('rp').value,rt:norm($('rt').value),date:new Date().toLocaleDateString('de-DE'),season:$('season').value});localStorage.f1driver=d;localStorage.f1races=JSON.stringify(races);msg('raceMsg',old==='—'||seconds(norm($('rt').value))<seconds(old)?'🏆 Neuer persönlicher Streckenrekord!':'✓ Ergebnis gespeichert');render()});

$('saveSetup').addEventListener('click',()=>{let name=$('setupName').value.trim();if(!name)return msg('setupMsg','Bitte Setup-Namen eingeben.');let values={};GROUPS.flatMap(x=>x[1]).forEach(([,id])=>values[id]=$('su_'+id).value.trim());setups.push({id:Date.now(),track:$('setupTrack').value,name,type:$('setupType').value,values,note:$('su_note').value.trim()});localStorage.f1setups=JSON.stringify(setups);msg('setupMsg','✓ Setup gespeichert');renderSetups()});$('setupTrack').addEventListener('change',renderSetups);function renderSetups(){let a=setups.filter(x=>x.track===$('setupTrack').value);$('setupList').innerHTML=a.length?a.map(x=>`<div class="card"><b>${esc(x.name)}</b> · <span class="sub">${esc(x.type)}</span>${GROUPS.map(([g,fs])=>`<div class="history"><b>${g}</b><br><span class="sub">${fs.map(([l,id])=>`${l}: ${esc(x.values?.[id]||'—')}`).join(' · ')}</span></div>`).join('')}<button class="danger" data-del="${x.id}">LÖSCHEN</button></div>`).join(''):'<div class="card">Noch kein Setup für diese Strecke.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{setups=setups.filter(x=>String(x.id)!==b.dataset.del);localStorage.f1setups=JSON.stringify(setups);renderSetups()})}

let sr=races.filter(x=>(x.season||'2026')===yr),sp=sr.reduce((a,x)=>a+(PTS[x.rp]||0),0);$('seasonSummary').innerHTML=`<div class="card"><b>${d}</b>${metrics([[sr.length,'Rennen'],[sp,'Punkte'],[sr.filter(x=>x.rp==='P1').length,'Siege'],[sr.filter(x=>['P1','P2','P3'].includes(x.rp)).length,'Podien']])}</div>`;let gains=races.map(x=>num(x.qp)&&num(x.rp)?num(x.qp)-num(x.rp):null).filter(x=>x!==null),net=gains.reduce((a,b)=>a+b,0);$('recordsBody').innerHTML=metrics([[poles,'Poles'],[Math.max(0,...gains),'+ Positionen'],[best(races,'qt'),'Qualifying PB'],[best(races,'rt'),'Race PB']])+`<div class="card"><b>POSITIONSBILANZ</b><h2>${net>=0?'+':''}${net}</h2></div>`;$('champSummary').innerHTML=`<b>${sr.length} / ${TRACKS.length} Rennen</b><h2>${sp} WM-Punkte</h2><div style="height:8px;background:#333"><div style="height:100%;width:${Math.min(100,sr.length/TRACKS.length*100)}%;background:#e10600"></div></div>`;$('champRounds').innerHTML=TRACKS.map((t,i)=>{let x=sr.find(r=>r.track===t);return `<div class="card"><b>ROUND ${i+1} · ${short(t)}</b><b style="float:right">${x?x.rp+' · '+(PTS[x.rp]||0)+' Pkt.':'OFFEN'}</b></div>`}).join('')}
let circuitFilter='all', circuitFavs=safe('f1trackfavs',[]);function renderCircuitList(){let q=($('circuitSearch')?.value||'').toLowerCase(),g=window._trackGroups||{};$('circuitList').innerHTML=TRACKS.map((t,i)=>({t,i,a:g[t]||[]})).filter(x=>x.t.toLowerCase().includes(q)&&(circuitFilter==='all'||(circuitFilter==='driven'&&x.a.length)||(circuitFilter==='fav'&&circuitFavs.includes(x.t)))).map(({t,i,a})=>`<div class="card circuitCard" data-track-index="${i}"><div class="circuitHead"><div class="circuitName">${short(t)}</div><div class="country">${esc(t.split(' · ')[0].toUpperCase())}</div></div>${IMGS[i]?`<img class="trackimg" src="track-${IMGS[i]}.jpg"><div class="artCaption">Illustrative Streckengrafik</div>`:''}<div class="trackBottom"><div class="miniMap">${IMGS[i]?`<img src="track-${IMGS[i]}.jpg">`:''}</div><div class="pb"><label>QUALIFYING PB</label><strong>${best(a,'qt')}</strong></div><div class="pb"><label>RENNRUNDE PB</label><strong>${best(a,'rt')}</strong></div></div></div>`).join('')||'<div class="card">Keine Strecke gefunden.</div>'}function openCircuit(i){let t=TRACKS[i],a=(window._trackGroups||{})[t]||[],br=a.slice().sort((x,y)=>(num(x.rp)||99)-(num(y.rp)||99))[0]?.rp||'—',ss=setups.filter(x=>x.track===t),fav=circuitFavs.includes(t);$('circuitDetailBody').innerHTML=`<h1>${short(t)}</h1><div class="detailTitleCountry">${esc(t.split(' · ')[0].toUpperCase())}</div><div class="card detailHero">${IMGS[i]?`<img class="trackimg" src="track-${IMGS[i]}.jpg">`:''}<div class="detailMap">${IMGS[i]?`<img src="track-${IMGS[i]}.jpg">`:''}</div><div class="detailStats"><div class="metrics"><div class="metric"><strong>${best(a,'qt')}</strong>QUALIFYING PB</div><div class="metric"><strong>${best(a,'rt')}</strong>RENNRUNDE PB</div></div><div class="metrics" style="margin-top:8px"><div class="metric"><strong>${a.length}</strong>Rennen</div><div class="metric"><strong>${a.filter(x=>x.rp==='P1').length}</strong>Siege</div><div class="metric"><strong>${br}</strong>Bestes Ergebnis</div></div></div></div><div class="card detailSetup"><div><span class="sub">⚙ MEIN SETUP</span><b>${ss[0]?esc(ss[0].name)+' · '+esc(ss[0].type):'Noch kein Setup'}</b></div><span>›</span></div><button type="button" class="menuBtn" id="favTrack">${fav?'★ FAVORIT':'☆ ALS FAVORIT'}</button><button type="button" class="primary" id="detailRace">RENNEN EINTRAGEN</button>`;$('favTrack').onclick=()=>{circuitFavs=fav?circuitFavs.filter(x=>x!==t):[...circuitFavs,t];localStorage.f1trackfavs=JSON.stringify(circuitFavs);openCircuit(i)};$('detailRace').onclick=()=>{$('track').selectedIndex=i;trackImage();go('entry')};go('circuitDetail')}document.addEventListener('click',e=>{let c=e.target.closest('.circuitCard');if(c)openCircuit(+c.dataset.trackIndex);let f=e.target.closest('.circuitFilter');if(f){circuitFilter=f.dataset.filter;document.querySelectorAll('.circuitFilter').forEach(x=>x.classList.toggle('active',x===f));renderCircuitList()}});setTimeout(()=>{$('circuitSearch')?.addEventListener('input',renderCircuitList)},0);
$('season').addEventListener('change',render);$('driver').addEventListener('input',()=>{localStorage.f1driver=$('driver').value;render()});
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:'1.11.3',driver:localStorage.f1driver||'',races,setups},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RaceCompanion_Backup.json';a.click()};$('importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.races)||!Array.isArray(x.setups))throw 0;localStorage.f1driver=x.driver||'';localStorage.f1races=JSON.stringify(x.races);localStorage.f1setups=JSON.stringify(x.setups);location.reload()}catch{msg('dataMsg','Ungültige Backup-Datei.')}};$('resetBtn').onclick=()=>{let y=$('season').value;if(confirm('Saison '+y+' wirklich zurücksetzen?')){races=races.filter(x=>(x.season||'2026')!==y);localStorage.f1races=JSON.stringify(races);render();msg('dataMsg','✓ Saison zurückgesetzt')}};
function num(x){return /^P\d+$/.test(x||'')?+x.slice(1):null}function short(t){return esc((t||'').split(' · ')[1]||t)}function metrics(a){return `<div class="metrics">${a.map(x=>`<div class="metric"><strong>${x[0]}</strong>${x[1]}</div>`).join('')}</div>`}function msg(id,t){$(id).className='notice';$(id).textContent=t}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();renderSetups();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
